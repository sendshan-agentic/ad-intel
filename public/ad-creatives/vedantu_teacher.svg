<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#ea4400"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgOrange)"/>

  <!-- White Vedantu Logo in Top Right -->
  <g transform="translate(470, 30)">
    <circle cx="14" cy="14" r="14" fill="#ffffff"/>
    <path d="M9 12l4 6 7-9" stroke="#ea4400" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="20" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Vedantu</text>
  </g>

  <!-- Male Educator in Black Polo -->
  <g transform="translate(200, 130)">
    <!-- Head -->
    <circle cx="100" cy="95" r="60" fill="#fbcfe8" fill-opacity="0.7"/>
    <circle cx="100" cy="95" r="58" fill="#fed7aa"/>
    <!-- Dark hair & neat beard -->
    <path d="M50 85 Q100 25 150 85 Z" fill="#18181b"/>
    <path d="M60 110 Q100 160 140 110 L135 135 Q100 165 65 135 Z" fill="#18181b"/> <!-- Beard -->
    
    <!-- Thick Framed Glasses -->
    <rect x="65" y="80" width="28" height="20" rx="4" fill="none" stroke="#09090b" stroke-width="4"/>
    <rect x="107" y="80" width="28" height="20" rx="4" fill="none" stroke="#09090b" stroke-width="4"/>
    <line x1="93" y1="90" x2="107" y2="90" stroke="#09090b" stroke-width="4"/>

    <!-- Black Polo Shirt Body -->
    <path d="M25 180 C25 150 60 150 100 150 C140 150 175 150 175 180 L205 420 L-5 420 Z" fill="#18181b"/>
    <!-- Polo Collar -->
    <polygon points="80,150 100,185 85,185" fill="#27272a"/>
    <polygon points="120,150 100,185 115,185" fill="#27272a"/>
    <!-- Orange Vedantu logo on chest -->
    <circle cx="140" cy="205" r="8" fill="#ff5400"/>
  </g>

  <!-- Play Button Overlay in Center -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="48" fill="#000000" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
  </g>
</svg>