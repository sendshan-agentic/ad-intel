<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgStage)"/>

  <!-- Stage Backdrop with CA WALLAH and PW Logo -->
  <rect x="60" y="60" width="480" height="130" rx="8" fill="#09090b" fill-opacity="0.8" stroke="#3f3f46" stroke-width="2"/>
  <text x="300" y="135" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="2">CA WALLAH</text>
  <text x="300" y="165" fill="#a1a1aa" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">BY PHYSICS WALLAH</text>

  <!-- Alakh Pandey on Stage with Mic (Left) -->
  <g transform="translate(140, 160)">
    <!-- Head -->
    <circle cx="70" cy="90" r="48" fill="#fed7aa"/>
    <path d="M35 70 Q70 25 105 70 Z" fill="#18181b"/>
    <path d="M42 95 Q70 140 98 95 L95 125 Q70 145 45 125 Z" fill="#18181b"/> <!-- Beard -->

    <!-- Black PW T-shirt Body -->
    <path d="M15 155 C15 135 45 135 70 135 C95 135 125 135 125 155 L150 370 L-10 370 Z" fill="#18181b"/>
    
    <!-- Microphone in hand -->
    <line x1="85" y1="210" x2="68" y2="160" stroke="#71717a" stroke-width="6"/>
    <circle cx="68" cy="155" r="9" fill="#09090b"/>
  </g>

  <!-- Senior Faculty Member in Turban (Right) -->
  <g transform="translate(330, 160)">
    <!-- Turban -->
    <ellipse cx="70" cy="70" rx="52" ry="40" fill="#0284c7"/>
    <circle cx="70" cy="100" r="45" fill="#fed7aa"/>
    <path d="M40 105 Q70 150 100 105 L95 135 Q70 155 45 135 Z" fill="#18181b"/> <!-- Beard -->
    <!-- Black Suit Body -->
    <path d="M15 160 C15 140 45 140 70 140 C95 140 125 140 125 160 L150 370 L-10 370 Z" fill="#18181b"/>
  </g>

  <!-- Play Button Overlay in Center -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="48" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
  </g>
</svg>