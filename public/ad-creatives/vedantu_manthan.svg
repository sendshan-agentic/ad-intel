<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgManthan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2033"/>
      <stop offset="100%" stop-color="#050e18"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgManthan)"/>

  <!-- Vedantu Logo Top Right -->
  <g transform="translate(470, 30)">
    <circle cx="14" cy="14" r="14" fill="#ff5400"/>
    <path d="M9 12l4 6 7-9" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="20" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Vedantu</text>
  </g>

  <!-- Student Figure (glasses, black Vedantu tee) -->
  <g transform="translate(200, 150)">
    <!-- Head -->
    <circle cx="100" cy="90" r="55" fill="#fcd34d"/>
    <!-- Hair -->
    <path d="M55 80 Q100 35 145 80 Z" fill="#1e293b"/>
    <!-- Glasses -->
    <rect x="68" y="78" width="26" height="18" rx="4" fill="none" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="106" y="78" width="26" height="18" rx="4" fill="none" stroke="#0f172a" stroke-width="3.5"/>
    <line x1="94" y1="87" x2="106" y2="87" stroke="#0f172a" stroke-width="3.5"/>
    <!-- Smile -->
    <path d="M85 118 Q100 130 115 118" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Black T-shirt Body -->
    <path d="M30 170 C30 145 65 145 100 145 C135 145 170 145 170 170 L195 380 L5 380 Z" fill="#111827"/>
    <!-- Orange Vedantu print on chest -->
    <circle cx="100" cy="200" r="10" fill="#ff5400"/>
    <text x="100" y="222" fill="#ff5400" font-family="-apple-system, sans-serif" font-size="9" font-weight="900" text-anchor="middle">Vedantu</text>
    
    <!-- Speaking hand gesture -->
    <circle cx="45" cy="240" r="18" fill="#fcd34d"/>
  </g>

  <!-- Top Badge -->
  <rect x="40" y="35" width="160" height="28" rx="6" fill="#1e3a8a" fill-opacity="0.8"/>
  <text x="120" y="54" fill="#93c5fd" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">NEET MANTHAN 3.0</text>

  <!-- Authentic Translucent Play Button in Center -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="48" fill="#000000" fill-opacity="0.45" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
  </g>
</svg>