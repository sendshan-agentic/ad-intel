<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgClass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgClass)"/>

  <!-- Classroom Floor and Walls -->
  <polygon points="0,350 600,350 600,600 0,600" fill="#4a5568"/>
  <rect x="180" y="80" width="240" height="150" rx="8" fill="#1a365d" stroke="#2b6cb0" stroke-width="4"/> <!-- Smart Board -->
  <text x="300" y="150" fill="#63b3ed" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle">BOARD + NEET 2028</text>
  <text x="300" y="180" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">Interactive Live Hybrid Session</text>

  <!-- Teacher standing near board -->
  <g transform="translate(130, 150)">
    <circle cx="20" cy="30" r="18" fill="#fed7aa"/>
    <rect x="5" y="50" width="30" height="80" rx="6" fill="#2b6cb0"/>
    <line x1="20" y1="130" x2="10" y2="200" stroke="#1a202c" stroke-width="8"/>
    <line x1="20" y1="130" x2="30" y2="200" stroke="#1a202c" stroke-width="8"/>
  </g>

  <!-- Students sitting at desks facing board -->
  <g transform="translate(60, 360)">
    <!-- Row 1 Desk & Student -->
    <rect x="0" y="50" width="140" height="40" rx="4" fill="#cbd5e0"/>
    <circle cx="70" cy="20" r="22" fill="#1a202c"/>
    <rect x="45" y="40" width="50" height="50" rx="8" fill="#e53e3e"/>

    <!-- Row 2 Desk & Student -->
    <rect x="180" y="50" width="140" height="40" rx="4" fill="#cbd5e0"/>
    <circle cx="250" cy="20" r="22" fill="#2d3748"/>
    <rect x="225" y="40" width="50" height="50" rx="8" fill="#3182ce"/>

    <!-- Row 3 Desk & Student -->
    <rect x="360" y="50" width="140" height="40" rx="4" fill="#cbd5e0"/>
    <circle cx="430" cy="20" r="22" fill="#1a202c"/>
    <rect x="405" y="40" width="50" height="50" rx="8" fill="#38a169"/>
  </g>

  <!-- White Vedantu Logo in Top Right -->
  <g transform="translate(470, 30)">
    <circle cx="14" cy="14" r="14" fill="#ffffff"/>
    <path d="M9 12l4 6 7-9" stroke="#ea4400" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="34" y="20" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">Vedantu</text>
  </g>

  <!-- Play Button Overlay in Center -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="48" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
  </g>
</svg>