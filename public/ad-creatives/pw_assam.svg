<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAssam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22543d"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgAssam)"/>

  <!-- Outdoor Campus / Trees Scene -->
  <circle cx="100" cy="150" r="140" fill="#2f855a" fill-opacity="0.3"/>
  <circle cx="500" cy="180" r="160" fill="#2f855a" fill-opacity="0.25"/>

  <!-- Top Badge: Shiksha Sera Assam -->
  <rect x="35" y="30" width="220" height="34" rx="6" fill="#e53e3e"/>
  <text x="48" y="52" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">PW ASSAM: SHIKSHA SERA</text>

  <!-- Two Students with Microphone Interview -->
  <g transform="translate(180, 140)">
    <!-- Student 1 Head & Body -->
    <circle cx="90" cy="90" r="50" fill="#fed7aa"/>
    <path d="M50 70 Q90 30 130 70 Z" fill="#1a202c"/>
    
    <!-- Maroon Kurta -->
    <path d="M25 160 C25 140 60 140 90 140 C120 140 155 140 155 160 L180 390 L0 390 Z" fill="#742a2a"/>
    
    <!-- Traditional Assamese Gamusa (White with Red Border Pattern) -->
    <path d="M60 140 L75 290 L95 290 L80 140 Z" fill="#f7fafc"/>
    <rect x="73" y="275" width="22" height="15" fill="#e53e3e"/> <!-- Red border -->

    <!-- Interview Microphone -->
    <line x1="160" y1="200" x2="110" y2="160" stroke="#cbd5e0" stroke-width="8" stroke-linecap="round"/>
    <rect x="100" y="145" width="16" height="24" rx="8" fill="#1a202c"/>
  </g>

  <!-- Play Button Overlay in Center -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="48" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
  </g>
</svg>