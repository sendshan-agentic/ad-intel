<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSuper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgSuper)"/>

  <!-- PW SuperClass Watermark Top Right -->
  <g transform="translate(430, 30)">
    <rect x="0" y="0" width="140" height="30" rx="6" fill="#27272a"/>
    <text x="12" y="20" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="12" font-weight="900">PW SUPERCLASS</text>
  </g>

  <!-- Young Faculty in Studio Setting -->
  <g transform="translate(200, 130)">
    <!-- Backlight aura -->
    <circle cx="100" cy="100" r="120" fill="#f59e0b" fill-opacity="0.08"/>

    <!-- Head -->
    <circle cx="100" cy="95" r="58" fill="#fed7aa"/>
    <!-- Stylish Hair & Full Beard -->
    <path d="M50 75 Q100 20 150 75 Z" fill="#18181b"/>
    <path d="M55 100 Q100 160 145 100 L140 140 Q100 170 60 140 Z" fill="#18181b"/>
    
    <!-- Black Suit Jacket / Blazer -->
    <path d="M20 180 C20 150 60 150 100 150 C140 150 180 150 180 180 L210 430 L-10 430 Z" fill="#18181b"/>
    <!-- Lapel / V-neck -->
    <polygon points="75,150 100,240 85,240" fill="#27272a"/>
    <polygon points="125,150 100,240 115,240" fill="#27272a"/>
    <polygon points="90,150 110,150 100,200" fill="#ffffff"/> <!-- White shirt collar -->
  </g>

  <!-- Play Button Overlay in Center -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="48" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3"/>
    <polygon points="-12,-20 22,0 -12,20" fill="#ffffff"/>
  </g>
</svg>